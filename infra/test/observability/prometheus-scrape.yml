# Prometheus scrape stub — Sufler TEST
# Merge into the bank Prometheus config (or use as a file_sd target).
#
# TLS: self-signed lab certs need insecure_skip_verify; bank CA → omit and
# mount the CA into Prometheus instead.

scrape_configs:
  - job_name: sufler-test
    metrics_path: /metrics/
    scheme: https
    scrape_interval: 30s
    scrape_timeout: 10s
    tls_config:
      insecure_skip_verify: true  # lab only; replace with ca_file in bank DC
    static_configs:
      - targets:
          - ai-hub-test.bank.local:443
        labels:
          env: test
          service: sufler
