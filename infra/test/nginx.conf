# Sufler TEST edge reverse proxy — TLS termination, HTTPS only.
# Mount as /etc/nginx/nginx.conf (Compose service `edge`).
#
# Certificates (not committed):
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem
# Generate self-signed: ./gen-self-signed-cert.sh  (see README)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 200m;

    # Docker Compose embedded DNS — defer host resolve so `nginx -t` works offline
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- HTTP: redirect everything to HTTPS (no plaintext app traffic) ---
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS: edge termination → Daphne (+ SPA for UI) ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS — TEST only; adjust max-age for bank policy
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Variable upstreams → Daphne ASGI (Django + Channels)
        set $daphne http://backend:8000;
        set $spa    http://frontend:80;

        # Application health → Daphne
        location = /health/ {
            proxy_pass $daphne;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Prometheus scrape → Daphne (restrict at network ACL in bank DC)
        location = /metrics/ {
            proxy_pass $daphne;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # REST / OpenAPI / assistant SSE → Daphne (no buffering for streams)
        location /api/ {
            proxy_pass $daphne;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            add_header X-Accel-Buffering no always;
        }

        # Channels WebSocket → Daphne
        location /ws {
            proxy_pass $daphne;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # CcReports SPA — /admin/reports is a frontend route, not Django admin
        location ^~ /admin/reports {
            proxy_pass $spa;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Django admin / auth / legacy routes → Daphne
        location ~ ^/(client-info|auth|accounts|admin|media)/ {
            proxy_pass $daphne;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Collected static via SPA container
        location /static/ {
            proxy_pass $spa;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # SPA UI
        location / {
            proxy_pass $spa;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
