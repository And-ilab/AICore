# Prod-like Compose for bank TEST VM (VII.3).
# Separate from local `infra/docker-compose.yml` (dev hot-reload).
#
# Usage:
#   cp .env.example .env   # fill secrets — never commit .env
#   ./deploy.sh
#
# Topology mirrors intended TEST/PROD services:
#   postgres (pgvector) · redis · minio · asr (stub/vosk) ·
#   backend (Daphne ASGI) · celery-worker · frontend · edge (TLS nginx)
#
# DB/Redis/MinIO are NOT published on the host (internal network only).
# Only edge nginx publishes host ports (80→HTTPS redirect, 443 TLS).
# Frontend/backend stay on the internal network.

name: sufler-test

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sufler}
      POSTGRES_USER: ${POSTGRES_USER:-sufler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    networks: [internal]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Internal network only — no host ports. Optional auth via REDIS_PASSWORD in .env.
    command:
      - sh
      - -c
      - |
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
        else
          exec redis-server --appendonly yes
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    # CI/registry: set BACKEND_IMAGE=ghcr.io/…/backend:<tag> and deploy with
    # `./deploy.sh pull-up` (no local --build). Local default tags the build.
    image: ${BACKEND_IMAGE:-sufler-backend:local}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_OCR_BUCKET: ${MINIO_OCR_BUCKET:-sufler-ocr}
      OCR_OBJECT_STORE_BACKEND: ${OCR_OBJECT_STORE_BACKEND:-minio}
      AI_INFERENCE_PROFILE: ${AI_INFERENCE_PROFILE:-test}
      MODEL_GATEWAY_MODE: ${MODEL_GATEWAY_MODE:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen2.5:3b}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-600}
      SUFLER_ALLOW_UNGROUNDED: ${SUFLER_ALLOW_UNGROUNDED:-1}
      SUFLER_LLM_BASE_URL: ${SUFLER_LLM_BASE_URL:-}
      SUFLER_LLM_API_KEY: ${SUFLER_LLM_API_KEY:-}
      SUFLER_LLM_MODEL: ${SUFLER_LLM_MODEL:-}
      ASSISTANT_LLM_BASE_URL: ${ASSISTANT_LLM_BASE_URL:-}
      ASSISTANT_LLM_API_KEY: ${ASSISTANT_LLM_API_KEY:-}
      ASSISTANT_LLM_MODEL: ${ASSISTANT_LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_ACTIVE_MODEL_PATH: ${OLLAMA_ACTIVE_MODEL_PATH:-/tmp/sufler_active_openai_model}
      LOCAL_LLM_MANAGER_URL: ${LOCAL_LLM_MANAGER_URL:-}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-stub}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-180}
      ASSISTANT_MAX_TOKENS: ${ASSISTANT_MAX_TOKENS:-256}
      ASR_HEALTH_URL: ${ASR_HEALTH_URL:-http://asr:8764/health}
      ASR_WS_URL: ${ASR_WS_URL:-ws://asr:8765/}
      AUDIT_FILE_PATH: /var/log/sufler/audit.jsonl
    command:
      - sh
      - -c
      - >
        python manage.py migrate --noinput
        && python manage.py collectstatic --noinput
        && daphne -b 0.0.0.0 -p 8000 sufler.asgi:application
    volumes:
      - audit_data:/var/log/sufler
      - static_data:/app/staticfiles
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      asr:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  celery-worker:
    image: ${BACKEND_IMAGE:-sufler-backend:local}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_OCR_BUCKET: ${MINIO_OCR_BUCKET:-sufler-ocr}
      OCR_OBJECT_STORE_BACKEND: ${OCR_OBJECT_STORE_BACKEND:-minio}
      AI_INFERENCE_PROFILE: ${AI_INFERENCE_PROFILE:-test}
      MODEL_GATEWAY_MODE: ${MODEL_GATEWAY_MODE:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen2.5:3b}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-600}
      SUFLER_ALLOW_UNGROUNDED: ${SUFLER_ALLOW_UNGROUNDED:-1}
      SUFLER_LLM_BASE_URL: ${SUFLER_LLM_BASE_URL:-}
      SUFLER_LLM_API_KEY: ${SUFLER_LLM_API_KEY:-}
      SUFLER_LLM_MODEL: ${SUFLER_LLM_MODEL:-}
      ASSISTANT_LLM_BASE_URL: ${ASSISTANT_LLM_BASE_URL:-}
      ASSISTANT_LLM_API_KEY: ${ASSISTANT_LLM_API_KEY:-}
      ASSISTANT_LLM_MODEL: ${ASSISTANT_LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_ACTIVE_MODEL_PATH: ${OLLAMA_ACTIVE_MODEL_PATH:-/tmp/sufler_active_openai_model}
      LOCAL_LLM_MANAGER_URL: ${LOCAL_LLM_MANAGER_URL:-}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-stub}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-180}
      ASSISTANT_MAX_TOKENS: ${ASSISTANT_MAX_TOKENS:-256}
      AUDIT_FILE_PATH: /var/log/sufler/audit.jsonl
    command: celery -A sufler worker --loglevel=info --hostname=worker@%h --concurrency=${CELERY_CONCURRENCY:-2}
    volumes:
      - audit_data:/var/log/sufler
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A sufler inspect ping --timeout=10 2>/dev/null | grep -qi pong || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s

  # CPU LLM via official Ollama. Enable: COMPOSE_PROFILES=cpu-inference
  # Pull models: docker compose --profile cpu-inference exec ollama ollama pull qwen2.5:3b
  ollama:
    profiles: ["cpu-inference"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ollama_data:/root/.ollama
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  # CPU embeddings (E5-large). Enable: COMPOSE_PROFILES=cpu-inference
  embedding:
    profiles: ["cpu-inference"]
    image: ${EMBEDDING_IMAGE:-sufler-embedding:local}
    build:
      context: ../../backend/services/embedding
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      HF_HOME: /models/hf-cache
      TRANSFORMERS_CACHE: /models/hf-cache
      SENTENCE_TRANSFORMERS_HOME: /models/hf-cache
    volumes:
      - ../../models:/models
    networks: [internal]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 240s

  # AI inference tier — ASR stub (approved_dev). No GPU required.
  # For Vosk: set ASR_MODE=vosk, mount model dir, optionally add device_requests.
  asr:
    image: ${ASR_IMAGE:-sufler-asr:local}
    build:
      context: ../../backend/services/asr
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASR_MODE: ${ASR_MODE:-stub}
      ASR_HOST: "0.0.0.0"
      ASR_WS_PORT: "8765"
      ASR_HEALTH_PORT: "8764"
      AI_INFERENCE_PROFILE: ${AI_INFERENCE_PROFILE:-test}
    # ports:  # optional host publish for debugging
    #   - "${ASR_HEALTH_PORT_HOST:-8764}:8764"
    #   - "${ASR_WS_PORT_HOST:-8765}:8765"
    networks: [internal]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8764/health', timeout=3)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    image: ${FRONTEND_IMAGE:-sufler-frontend:local}
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # Public HTTP(S) is via `edge` only. Optional debug publish:
    # ports: ["${FRONTEND_PORT_HOST:-8080}:80"]
    expose:
      - "80"
    volumes:
      - static_data:/var/www/django-static:ro
    networks: [internal]
    depends_on:
      backend:
        condition: service_healthy

  # Edge TLS termination — HTTPS only (HTTP → 301 HTTPS). See nginx.conf + certs/.
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [internal]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1/healthz",
        ]
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 5s

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  audit_data:
  static_data:
  ollama_data:
