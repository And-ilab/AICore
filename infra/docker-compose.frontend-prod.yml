# Override: serve built SPA via nginx instead of Vite HMR.
# Use on the bank TEST/PROD VM so the UI does not white-screen on 504 from Vite.
#
# Applied by default from local-inference/up-cpu.sh (FRONTEND_MODE=prod).
# AD / bank image: leave VITE_ALLOW_DEV_LOGIN and VITE_SUFLER_DEMO empty.
# Set them only for a mock_ldap demo build (password = AUTH_MOCK_LDAP_DEFAULT_PASSWORD).
name: sufler

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_ALLOW_DEV_LOGIN: ${VITE_ALLOW_DEV_LOGIN:-}
        VITE_DEV_AUTH_USER: ${VITE_DEV_AUTH_USER:-}
        # Must match backend AUTH_MOCK_LDAP_DEFAULT_PASSWORD when mock auto-login is on.
        VITE_DEV_AUTH_PASSWORD: ${VITE_DEV_AUTH_PASSWORD:-}
        VITE_DEV_RBAC_ROLES: ${VITE_DEV_RBAC_ROLES:-}
        # Demo simulator and role personas. Empty for an AD build.
        VITE_SUFLER_DEMO: ${VITE_SUFLER_DEMO:-}
    image: ${FRONTEND_IMAGE:-sufler-frontend:local}
    restart: unless-stopped
    # Clear Vite-only settings from docker-compose.yml (Compose merge reset).
    environment: !reset {}
    volumes: !reset []
    command: !reset []
    ports: !override
      - "${FRONTEND_PORT_HOST:-5173}:80"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1/healthz",
        ]
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 10s
